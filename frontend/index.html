<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnswerSheet AI</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#E6F8FD;--bg2:#4FC3F0;--ink:#10105A;--pri:#6C4FD8;--deep:#4A2C8F;--sun:#F7C535;--lav:#E4DBFB;--cream:#FFF6E5;--card:#fff;--okt:#1b7f56;--badt:#b8431f;--ok:#2FB67C;--bad:#F2704F;--mut:#5b5b8a;--line:#e3def5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#14123a;--bg2:#1d3a66;--ink:#f1efff;--pri:#7b5fe6;--deep:#2a1a5a;--lav:#2e2660;--cream:#2b2748;--card:#1e1b45;--okt:#5fe0a6;--badt:#ff9a7e;--mut:#aaa6d6;--line:#3a3570;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#14123a;--bg2:#1d3a66;--ink:#f1efff;--pri:#7b5fe6;--deep:#2a1a5a;--lav:#2e2660;--cream:#2b2748;--card:#1e1b45;--okt:#5fe0a6;--badt:#ff9a7e;--mut:#aaa6d6;--line:#3a3570;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:500 15px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg1) linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--deep);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
nav b{font-size:19px;margin-bottom:14px;display:block}
nav a{color:#e9e2ff;text-decoration:none;padding:10px 12px;border-radius:12px;font-weight:700}
nav a.on{background:var(--sun);color:#10105A}
main{padding:24px;max-width:1100px;width:100%;min-width:0}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;align-items:center;padding:12px}nav b{margin:0 8px 0 0;white-space:nowrap}nav a{white-space:nowrap}main{padding:16px}}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 24px #10105a1f;margin-bottom:18px}
h1{font-size:28px;margin:0 0 6px;font-weight:800;line-height:1.2}h2{font-size:19px;margin:0 0 12px}p{margin:0 0 10px}
.mut{color:var(--mut)}
.btn{border:0;border-radius:12px;padding:10px 18px;font:800 14px Nunito,sans-serif;cursor:pointer;background:var(--pri);color:#fff}.btn:hover{filter:brightness(.92)}
.btn.sun{background:var(--sun);color:#10105A}.btn.out{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--cream);border-radius:16px;padding:14px}.stat b{font-size:26px;display:block}.stat span{color:var(--mut);font-size:13px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--deep);color:#fff;text-align:left;padding:10px;white-space:nowrap}th[data-a]{cursor:pointer}
td{padding:9px 10px;border-bottom:1px solid var(--line)}tr[data-a]:hover{background:var(--lav);cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--lav);color:var(--ink)}
.chip.ok{background:#2FB67C2e;color:var(--okt)}.chip.bad{background:#F2704F2e;color:var(--badt)}.chip.warn{background:#F7C53559;color:var(--ink)}
.badt{color:var(--badt);font-weight:800}
.prog{height:12px;border-radius:9px;background:var(--lav);overflow:hidden;margin:8px 0 14px}.prog i{display:block;height:100%;background:var(--pri);transition:width .4s}
.drop{display:block;border:3px dashed var(--pri);border-radius:18px;padding:30px;text-align:center;background:var(--cream);cursor:pointer;margin-bottom:12px}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.steps span{padding:6px 14px;border-radius:99px;background:var(--lav);font-weight:800;font-size:13px}
.steps .on{background:var(--pri);color:#fff}.steps .done{background:var(--ok);color:#10105A}
.err{background:#F2704F2e;color:var(--badt);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between;margin-top:16px}
.hero{display:flex;align-items:center;gap:22px;background:var(--lav);flex-wrap:wrap}.hero svg{width:140px;flex:none}.hero div{flex:1;min-width:220px}
.hist{display:flex;align-items:flex-end;gap:14px;height:160px}.hist div{flex:1;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.hist i{display:block;background:var(--pri);border-radius:8px 8px 0 0;margin-bottom:4px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:12px}.keygrid input{width:100%}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);background:var(--card);box-shadow:-8px 0 30px #10105a55;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));overflow:auto;z-index:20}
.ov{position:fixed;inset:0;background:#10105a99;display:grid;place-items:center;z-index:30;padding:16px}.ov .card{width:min(400px,100%);margin:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg1);padding:10px 18px;border-radius:12px;z-index:40;font-weight:700}
label.f{display:block;margin-bottom:12px;font-weight:700}label.f input,label.f select{display:block;margin-top:4px;width:100%;max-width:360px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- login / registration ---- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{display:grid;grid-template-columns:1fr 1fr;width:min(980px,100%);min-height:640px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px #10105a40}
.auth-brand{position:relative;overflow:hidden;color:#fff;padding:34px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,#4A2C8F 0%,#5a38b8 55%,#6C4FD8 100%);isolation:isolate}
.auth-brand .blobs{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.auth-brand .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.auth-brand .logo svg{width:44px;height:44px}
.auth-brand h2{font-size:34px;line-height:1.15;font-weight:800;margin:0 0 10px;color:#fff}
.auth-brand p{margin:0;color:#e9e2ff;max-width:300px}
.auth-brand .mascot{width:112px;margin-bottom:14px;filter:drop-shadow(0 8px 14px #10105a55)}
.auth-brand .tag{font-weight:800;letter-spacing:.04em;color:#F7C535}
.auth-form{padding:44px 46px;display:flex;flex-direction:column;justify-content:center}
.auth-form h1{font-size:30px;margin:0 0 4px}
.auth-form .sub{margin:0 0 22px;color:var(--mut)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.fld .opt{font-weight:500;color:var(--mut)}
.fld input[type=text],.fld input[type=email],.fld input[type=password]{width:100%;max-width:none;padding:11px 12px;border-radius:10px;border:2px solid var(--line);transition:border-color .15s,box-shadow .15s}
.fld input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px #F7C53599}
.fld input[aria-invalid=true]{border-color:var(--bad)}
.fld .msg{display:block;min-height:0;color:var(--badt);font-size:13px;font-weight:700;margin-top:4px}
.pw{position:relative}.pw input{padding-right:46px!important}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.eye:hover{color:var(--pri)}.eye svg{width:20px;height:20px}
.meter{display:flex;gap:6px;margin-top:8px}.meter i{flex:1;height:6px;border-radius:9px;background:var(--lav);transition:background .2s}
.meter-l{font-size:12px;color:var(--mut);margin-top:4px;min-height:16px;font-weight:700}
.auth-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 18px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--pri);flex:none}
.chk a,.auth-form a{color:var(--pri);font-weight:800;text-decoration:none}.chk a:hover,.auth-form a:hover{text-decoration:underline}
.auth-btn{width:100%;padding:13px 18px;font-size:15px;display:flex;justify-content:center;align-items:center;gap:10px}
.auth-btn .sp{width:16px;height:16px;border:3px solid #10105a44;border-top-color:#10105A;border-radius:50%;animation:spin .7s linear infinite;display:none}
.auth-btn.busy .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-alt{text-align:center;margin:18px 0 0;color:var(--mut)}
.auth .err{margin-bottom:14px}
.nav-user{margin-top:auto;padding-top:14px;border-top:1px solid #ffffff2e;display:flex;flex-direction:column;gap:8px;font-size:13px}
.nav-user b{font-size:14px;margin:0;display:block;overflow:hidden;text-overflow:ellipsis}
.nav-user button{background:transparent;color:#fff;border:2px solid #ffffff66;border-radius:10px;padding:7px 10px;font:800 13px Nunito,sans-serif;cursor:pointer}
.nav-user button:hover{background:#ffffff1f}
@media(max-width:820px){.auth{padding:0;place-items:stretch}.auth-card{grid-template-columns:1fr;border-radius:0;min-height:100vh}.auth-brand{padding:22px 24px;gap:14px}.auth-brand .mascot,.auth-brand p{display:none}.auth-brand h2{font-size:24px;margin:0}.auth-brand .tag{display:none}.auth-form{padding:28px 22px 36px;justify-content:flex-start}.nav-user{margin:0 0 0 auto;padding:0;border:0;flex-direction:row;align-items:center}.nav-user b{display:none}}
@media(prefers-reduced-motion:reduce){.auth-btn .sp{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API=location.protocol==='file:'?'http://127.0.0.1:8000':'';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SK='answersheet_session';
function readSession(){for(const st of [localStorage,sessionStorage]){try{const j=JSON.parse(st.getItem(SK)||'null');if(j&&j.tok)return j}catch(e){}}return null}
function saveSession(tok,user,persist){clearSession();try{(persist?localStorage:sessionStorage).setItem(SK,JSON.stringify({tok,user}))}catch(e){}}
function clearSession(){for(const st of [localStorage,sessionStorage]){try{st.removeItem(SK)}catch(e){}}}
const SES=readSession();
const S={tok:SES?SES.tok:null,user:SES?SES.user:null,step:1,title:'',paperName:'',keyName:'',keySource:'',files:[],Q:[],neg:0,busy:'',err:'',exam:null,exams:[],dash:null,res:null,sub:[],un:[],cfg:null,sort:'roll_no',dir:1,q:'',sel:null,modal:null};
let T;
async function api(p,o){o=o||{};if(S.tok)o={...o,headers:{...(o.headers||{}),Authorization:'Bearer '+S.tok}};let r;try{r=await fetch(API+p,o)}catch(e){throw new Error('Cannot reach the server. Start the backend: uvicorn app.main:app --reload')}
 if(!r.ok){if(r.status==401&&S.tok){expire();throw new Error('Your session has expired. Please sign in again.')}let m='Request failed ('+r.status+')';try{const j=await r.json();m=typeof j.detail=='string'?j.detail:JSON.stringify(j.detail)}catch(e){}throw new Error(m)}return r.json()}
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
const ROBOT='<svg viewBox="0 0 120 130" aria-hidden="true"><line x1="60" y1="8" x2="60" y2="22" stroke="#4A2C8F" stroke-width="4"/><circle cx="60" cy="7" r="6" fill="#F2704F"/><rect x="22" y="20" width="76" height="58" rx="26" fill="#F7C535"/><circle cx="44" cy="48" r="9" fill="#fff"/><circle cx="76" cy="48" r="9" fill="#fff"/><circle cx="46" cy="49" r="4" fill="#4A2C8F"/><circle cx="78" cy="49" r="4" fill="#4A2C8F"/><path d="M48 66q12 9 24 0" stroke="#4A2C8F" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="34" y="84" width="52" height="40" rx="16" fill="#F7C535"/><rect x="48" y="94" width="24" height="20" rx="8" fill="#6C4FD8"/></svg>';
const stat=(b,s)=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`;
const TOT=()=>S.Q.reduce((a,q)=>a+(+q.marks||0),0);
const route=()=>{let h=location.hash.slice(1);if(!PG[h])h='dashboard';const a=h=='login'||h=='register';if(!S.tok&&!a)return'login';if(S.tok&&a)return'dashboard';return h};
function go(h){if(location.hash.slice(1)==h)load();else location.hash=h}
function logout(){clearInterval(T);clearSession();Object.assign(S,{tok:null,user:null,exam:null,exams:[],dash:null,res:null,sub:[],un:[],cfg:null,sel:null,modal:null,err:'',step:1,Q:[],files:[],paperName:'',keyName:'',keySource:'',title:''});go('login')}
function expire(){toast('Your session has expired. Please sign in again.');logout()}
const empty=(t,p)=>`<div class="card hero">${ROBOT}<div><h1>${t}</h1><p class="mut">${p}</p><a href="#create"><button class="btn sun" type="button">Create new exam</button></a></div></div>`;

function dashboard(){const d=S.dash;if(!d)return'<p>Loading…</p>';if(!d.exams)return empty('Check a whole class in minutes','Upload the question paper once, then every student’s answer sheet. The AI reads them and the app scores them.');
return `<div class="card hero">${ROBOT}<div><h1>Check a whole class in minutes</h1><p class="mut">Upload the question paper once, then drop in every student’s answer sheet. The AI reads, checks and scores them.</p><a href="#create"><button class="btn sun" type="button">Create new exam</button></a></div></div>
<div class="stats">${stat(d.exams,'Exams created')}${stat(d.sheets_checked,'Sheets checked')}${stat(d.average+'%','Average score')}${stat(d.needs_review,'Sheets needing review')}</div>
<div class="card"><h2>Recent exams</h2><div class="wrap"><table><tr><th>Exam</th><th>Sheets</th><th>Status</th></tr>${d.recent.map(e=>`<tr data-a="goto" data-i="${e.id}" tabindex="0"><td>${E(e.title)}</td><td>${e.sheets}</td><td><span class="chip ${e.status=='Done'?'ok':'warn'}">${e.status}${e.needs_review?' ('+e.needs_review+' to review)':''}</span></td></tr>`).join('')}</table></div></div>`}

function drop(k,label,hint,acc,multi){return `<label class="drop" data-f="${k}"><input type="file" hidden ${multi?'multiple':''} accept="${acc}" data-c="file" data-k="${k}"><h2>${label}</h2><span class="mut">${hint}</span></label>`}
function create(){const names=['Question paper','Check questions','Answer key','Student sheets'];
let b='',ok=!S.busy;
if(S.step==1){ok=ok&&!!S.paperName;b=`<h2>Upload the question paper</h2>${drop('paper','Drop the question paper here','One PDF or image per exam. The AI reads the questions, marks and negative marking.','.pdf,.jpg,.jpeg,.png')}${S.paperName?`<p>Read: <span class="chip ok">${E(S.paperName)}</span> ${S.Q.length} questions found</p>`:''}`}
if(S.step==2){b=`<h2>Check what the AI read</h2><div class="row"><label>Exam title <input value="${E(S.title)}" data-c="title"></label><label>Negative marking per wrong answer <input type="number" step="0.25" max="0" value="${S.neg}" data-c="neg" style="width:90px"></label><span class="chip">Total marks: ${TOT()}</span></div>
<div class="wrap"><table><tr><th>Q</th><th>Question</th><th>Type</th><th>Marks</th></tr>${S.Q.map((q,i)=>`<tr><td>${q.number}</td><td><input value="${E(q.text)}" data-c="qt" data-i="${i}" aria-label="Question ${q.number} text" style="width:100%;min-width:220px"></td><td><select data-c="qy" data-i="${i}" aria-label="Question ${q.number} type"><option${q.type=='MCQ'?' selected':''}>MCQ</option><option${q.type=='Numeric'?' selected':''}>Numeric</option></select></td><td><input type="number" min="0" value="${q.marks}" data-c="qm" data-i="${i}" aria-label="Question ${q.number} marks" style="width:70px"></td></tr>`).join('')}</table></div>`}
if(S.step==3){const full=S.Q.every(q=>String(q.correct).trim()!=='');ok=ok&&full;b=`<h2>Upload the answer key</h2>${drop('key','Drop the answer key here','PDF, JPG or PNG image, CSV or Excel (.xlsx). For images, local OCR runs first and Ollama vision is the fallback.','.pdf,.jpg,.jpeg,.png,.csv,.xlsx')}${S.keyName?`<p>Read: <span class="chip ok">${E(S.keyName)}</span>${S.keySource?` <span class="chip">Read by ${E(S.keySource)}</span>`:''}</p>`:''}${S.keyName||S.Q.some(q=>q.correct)?`<p>Check the answers below and fix any mistakes. ${full?'':'<span class="chip bad">Some answers are missing</span>'}</p><div class="keygrid">${S.Q.map((q,i)=>`<label>Q${q.number}<input value="${E(q.correct)}" data-c="key" data-i="${i}"></label>`).join('')}</div>`:''}`}
if(S.step==4){ok=ok&&S.files.length>0;b=`<h2>Upload student answer sheets</h2>${drop('sheets','Drop all answer sheets here','One PDF per student, about 50 per exam. The roll number and name are read from each sheet.','.pdf,.jpg,.jpeg,.png',1)}<p><b>${S.files.length}</b> sheets ready</p><div class="row">${S.files.map((f,i)=>`<span class="chip">${E(f.name)} <button data-a="rm" data-i="${i}" aria-label="Remove ${E(f.name)}" style="border:0;background:none;color:inherit;cursor:pointer;font-weight:800">×</button></span>`).join('')}</div>`}
return `<div class="steps">${names.map((s,i)=>`<span class="${i+1==S.step?'on':i+1<S.step?'done':''}">${i+1}. ${s}</span>`).join('')}</div><div class="card">${b}${S.busy?`<p><span class="chip warn" role="status">${S.busy}</span></p>`:''}<div class="row sp"><button class="btn out" data-a="step" data-i="${S.step-1}" ${S.step==1||S.busy?'disabled':''}>Back</button>${S.step<4?`<button class="btn" data-a="step" data-i="${S.step+1}" ${ok?'':'disabled'}>${S.step==2?'Confirm questions':S.step==3?'Confirm key':'Next'}</button>`:`<button class="btn sun" data-a="run" ${ok?'':'disabled'}>Start checking</button>`}</div></div>`}

function picker(){return S.exams.length?`<label class="f" style="max-width:360px">Exam<select data-c="exam">${S.exams.map(e=>`<option value="${e.id}"${e.id==S.exam?' selected':''}>${E(e.title)}</option>`).join('')}</select></label>`:''}
function processing(){if(!S.exams.length)return empty('No batch is running','Create an exam and upload sheets to see them being checked here.');
const lab={queued:'Queued',reading:'Reading',done:'Done',needs_review:'Needs review'},st=S.sub,done=st.filter(s=>s.status=='done'||s.status=='needs_review').length,fin=st.length>0&&done==st.length;
return `${picker()}<div class="card hero">${ROBOT}<div><h1>${fin?'All sheets checked':'AI is checking…'}</h1><div class="prog" role="progressbar" aria-valuenow="${st.length?Math.round(done/st.length*100):0}" aria-valuemin="0" aria-valuemax="100"><i style="width:${st.length?done/st.length*100:0}%"></i></div><p class="mut">${done} of ${st.length} sheets finished</p>${fin?'<a href="#results"><button class="btn sun" type="button">View results</button></a>':''}</div></div>
<div class="card wrap"><table><tr><th>File</th><th>Roll number</th><th>Status</th></tr>${st.map(s=>`<tr><td>${E(s.filename)}</td><td>${s.status=='queued'?'—':s.roll_no?E(s.roll_no):s.status=='reading'?'…':'Unreadable'}</td><td><span class="chip ${s.status=='done'?'ok':s.status=='needs_review'?'bad':s.status=='reading'?'warn':''}">${lab[s.status]}</span></td></tr>`).join('')}</table></div>`}

function rows(){const k=S.sort,q=S.q.toLowerCase();return S.res.rows.filter(x=>!q||(x.name+x.roll_no).toLowerCase().includes(q)).sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*S.dir).map(x=>`<tr data-a="open" data-i="${x.id}" tabindex="0"><td>${E(x.roll_no)}</td><td>${E(x.name)}</td><td><b>${x.total}</b></td><td>${S.res.exam.total_marks}</td><td>${x.pct}%</td><td>${x.correct==null?'—':x.correct}</td><td>${x.wrong==null?'—':x.wrong}</td><td>${x.unanswered==null?'—':x.unanswered}</td></tr>`).join('')}
function results(){if(!S.exams.length)return empty('No results yet','Results appear here once you have checked a batch of sheets.');if(!S.res)return picker()+'<p>Loading…</p>';
const r=S.res,p=r.rows.map(x=>x.pct),bins=[0,0,0,0];p.forEach(v=>bins[v<40?0:v<60?1:v<80?2:3]++);
const th=(k,l)=>`<th data-a="sort" data-k="${k}" tabindex="0">${l}${S.sort==k?(S.dir>0?' ▲':' ▼'):''}</th>`;
return `${picker()}<h1>${E(r.exam.title)}</h1><p class="mut">Total marks ${r.exam.total_marks}. Negative marking ${r.exam.negative_marking} per wrong answer.</p>
<div class="stats">${stat(r.stats.students,'Students checked')}${stat(r.stats.average+'%','Class average')}${stat(r.stats.highest+'%','Highest')}${stat(r.stats.lowest+'%','Lowest')}${stat(r.stats.needs_review,'Need review')}</div>
<div class="card"><div class="row sp" style="margin:0 0 12px"><input id="q" type="search" placeholder="Search name or roll number" value="${E(S.q)}" aria-label="Search students"><button class="btn out" data-a="xl">Download Excel</button></div>
<div class="wrap"><table><tr>${th('roll_no','Roll number')}${th('name','Name')}${th('total','Marks')}<th>Total</th>${th('pct','Percentage')}${th('correct','Correct')}${th('wrong','Wrong')}${th('unanswered','Unanswered')}</tr><tbody id="tb">${rows()}</tbody></table></div></div>
<div class="card"><h2>Score distribution</h2><div class="hist">${bins.map((n,i)=>`<div><i style="height:${n/Math.max(...bins,1)*110}px"></i>${n}<br><span class="mut">${['Below 40%','40–59%','60–79%','80–100%'][i]}</span></div>`).join('')}</div></div>`}

function drawer(){if(S.sel==null||!S.res)return'';const x=S.res.rows.find(r=>r.id==S.sel);if(!x)return'';
return `<aside class="drawer" aria-label="Student detail"><div class="row sp" style="margin-top:0"><h2 style="margin:0">${E(x.name)}</h2><button class="btn out" data-a="close">Close</button></div><p class="mut">Roll ${E(x.roll_no)}. Score <b>${x.total} / ${S.res.exam.total_marks}</b> (${x.pct}%)${x.manual?' <span class="chip warn">Marked manually</span>':''}</p>
<div class="wrap"><table><tr><th>Q</th><th>Answer</th><th>Key</th><th>Result</th><th>Marks</th></tr>${x.answers.map(g=>`<tr><td>${g.number}</td><td>${E(g.student_answer||'—')}</td><td>${E(g.correct_answer)}</td><td><span class="chip ${g.result=='correct'?'ok':g.result=='wrong'||g.result=='unreadable'?'bad':''}">${g.result}</span></td><td class="${g.marks<0?'badt':''}">${g.marks>0?'+':''}${g.marks}</td></tr>`).join('')}</table></div></aside>`}

function unreadable(){if(!S.exams.length)return empty('Nothing to review','Sheets the AI cannot read with confidence are listed here.');
return `${picker()}<h1>Unreadable sheets</h1><p class="mut">The AI did not guess on these. Check each sheet by hand and enter the marks.</p><div class="card wrap">${S.un.length?`<table><tr><th>Roll number or file</th><th>Unreadable</th><th>Reason</th><th></th></tr>${S.un.map(u=>`<tr><td>${E(u.roll_no||'(unreadable)')} (${E(u.filename)})</td><td>${E(u.detail)}</td><td>${E(u.reason)}</td><td><button class="btn" data-a="man" data-i="${u.id}">Mark manually</button></td></tr>`).join('')}</table>`:'<p>No unreadable sheets for this exam.</p>'}</div>`}
function modal(){if(S.modal==null)return'';const u=S.un.find(x=>x.id==S.modal),t=S.res?S.res.exam.total_marks:'';return `<div class="ov"><div class="card" role="dialog" aria-label="Mark manually"><h2>Mark ${E(u?u.filename:'')}</h2><label class="f">Student name<input id="mn" value="${E(u?.name||'')}" placeholder="Enter student name"></label><label class="f">Roll number<input id="mr" value="${E(u?.roll_no||'')}" placeholder="Enter roll number"></label><label class="f">Total marks<input id="mv" type="number" min="0" step="0.25" value="0"></label><p class="mut">This is a total-only manual mark. Correct/Wrong question counts will show as — because no individual answers were graded.</p><div class="row"><button class="btn" data-a="save">Save marks</button><button class="btn out" data-a="close">Cancel</button></div></div></div>`}
function preferences(){const c=S.cfg;return `<h1>Preferences</h1><div class="card">${c?`<p><b>AI provider:</b> ${c.provider} (${E(c.model)}) ${c.llm_ready?'<span class="chip ok">Ready</span>':'<span class="chip bad">API key missing</span>'}</p><p><b>Database:</b> ${E(c.database)}</p>${c.llm_message?`<p class="mut">${E(c.llm_message)}</p>`:''}<p class="mut">These are set in <code>backend/.env</code>. API keys are kept on the server, never in the browser.</p>`:'<p>Loading…</p>'}</div>`}

const NAV=[['dashboard','Dashboard'],['create','Create exam'],['processing','Processing'],['results','Results'],['unreadable','Unreadable sheets'],['preferences','Preferences']],PG={dashboard,create,processing,results,unreadable,preferences,login,register};
function render(){const r=route();if(r=='login'||r=='register'){const keep=authKeep();$('#app').innerHTML=PG[r]();authRestore(keep);return}
$('#app').innerHTML=`<div class="app"><nav><b>AnswerSheet AI</b>${NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==r?'on':''}">${n[1]}</a>`).join('')}<div class="nav-user">${S.user?`<b title="${E(S.user.email)}">${E(S.user.full_name)}</b>`:''}<button type="button" data-a="logout">Log out</button></div></nav><main>${S.err?`<div class="err" role="alert">${E(S.err)}</div>`:''}${PG[r]()}</main></div>${drawer()}${modal()}`}

async function poll(){try{S.sub=await api(`/api/exams/${S.exam}/status`);S.err=''}catch(e){S.err=e.message}if(route()=='processing')render();if(S.sub.length&&S.sub.every(s=>s.status=='done'||s.status=='needs_review'))clearInterval(T)}
async function load(){clearInterval(T);S.err='';const r=route();
 try{if(r=='dashboard')S.dash=await api('/api/dashboard');
  if(r=='preferences')S.cfg=await api('/api/config');
  if(['results','unreadable','processing'].includes(r)){S.exams=await api('/api/exams');if(!S.exams.find(e=>e.id==S.exam))S.exam=S.exams.length?S.exams[0].id:null;
   if(S.exam!=null){if(r=='results')S.res=await api(`/api/exams/${S.exam}/results`);if(r=='unreadable')S.un=await api(`/api/exams/${S.exam}/unreadable`);if(r=='processing'){await poll();T=setInterval(poll,2000)}}}
 }catch(e){S.err=e.message}render()}

async function send(path,fd,busy){S.busy=busy;S.err='';render();try{return await api(path,{method:'POST',body:fd})}catch(e){toast(e.message);return null}finally{S.busy='';render()}}
async function handleFiles(k,list){const f=[...list];if(!f.length)return;
 if(k=='sheets'){S.files=S.files.concat(f);render();return}
 const fd=new FormData();fd.append('file',f[0]);
 if(k=='paper'){const r=await send('/api/exams/parse-paper',fd,'Reading the question paper…');if(r){S.Q=r.questions.map(q=>({number:q.number,text:q.text||'',type:q.type=='Numeric'?'Numeric':'MCQ',marks:q.marks,correct:q.correct_answer||''}));S.neg=Math.min(0,+r.negative_marking||0);S.title=r.title||f[0].name.replace(/\.[^.]+$/,'');S.paperName=f[0].name;render()}}
 if(k=='key'){const r=await send('/api/exams/parse-key',fd,'Reading the answer key…');if(r){S.Q.forEach(q=>{if(r.answers[q.number]!=null)q.correct=r.answers[q.number]});S.keyName=f[0].name;S.keySource=r.source||'table';render()}}}
async function run(){S.busy='Creating exam and uploading sheets…';S.err='';render();
 try{const ex=await api('/api/exams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:S.title,negative_marking:S.neg,questions:S.Q.map(q=>({number:q.number,text:q.text,type:q.type,marks:+q.marks,correct_answer:String(q.correct)}))})});
  const fd=new FormData();S.files.forEach(f=>fd.append('files',f));await api(`/api/exams/${ex.id}/sheets`,{method:'POST',body:fd});
  S.exam=ex.id;S.step=1;S.Q=[];S.files=[];S.paperName=S.keyName=S.keySource='';S.busy='';location.hash='processing'}
 catch(e){S.busy='';toast(e.message);render()}}

/* ---------------- login / registration ---------------- */
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const LOGO='<svg viewBox="0 0 60 60" fill="none" stroke="#fff" stroke-width="3.5" aria-hidden="true"><circle cx="22" cy="30" r="17"/><circle cx="38" cy="30" r="17"/></svg>';
const BLOBS='<svg class="blobs" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FC3F0"/><stop offset="1" stop-color="#6C4FD8"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4DBFB" stop-opacity=".55"/><stop offset="1" stop-color="#6C4FD8" stop-opacity=".1"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B5FE6"/><stop offset="1" stop-color="#4A2C8F"/></linearGradient></defs><path d="M-20 430C60 380 140 430 150 510S120 640 60 700L-20 700Z" fill="url(#g3)" opacity=".9"/><path d="M420 -20L420 220C340 200 300 130 330 60C345 20 380 0 420 -20Z" fill="url(#g2)"/><path d="M420 300C360 330 320 400 350 470C380 540 420 560 420 640Z" fill="url(#g2)"/><circle cx="300" cy="120" r="50" fill="url(#g1)" opacity=".85"/><circle cx="215" cy="205" r="16" fill="url(#g3)" opacity=".8"/><circle cx="340" cy="560" r="12" fill="#F7C535"/><circle cx="352" cy="270" r="7" fill="#F7C535" opacity=".9"/></svg>';
function fld(id,label,type,o){o=o||{};const pw=type=='password';return `<label class="fld" for="${id}"><span>${label}${o.opt?' <span class="opt">(optional)</span>':''}</span>${pw?'<div class="pw">':''}<input id="${id}" name="${id}" type="${type}" ${o.ac?`autocomplete="${o.ac}"`:''} ${o.ph?`placeholder="${o.ph}"`:''} ${o.max?`maxlength="${o.max}"`:''} aria-describedby="${id}-m" ${o.req===false?'':'required'}>${pw?`<button type="button" class="eye" data-eye="${id}" aria-label="Show password" aria-pressed="false">${EYE}</button></div>`:''}<small class="msg" id="${id}-m" role="alert"></small></label>`}
function authShell(h,sub,form){return `<div class="auth"><div class="auth-card"><aside class="auth-brand">${BLOBS}<div class="logo">${LOGO}<span>AnswerSheet AI</span></div><div>${ROBOT.replace('<svg ','<svg class="mascot" ')}<h2>${h}</h2><p>${sub}</p></div><div class="tag">Read. Check. Score.</div></aside><main class="auth-form">${form}</main></div></div>`}
function login(){return authShell('Welcome Back','Sign in to check your next batch of answer sheets.',
`<h1>Sign In</h1><p class="sub">Use the email you registered with.</p><div id="aerr"></div>
<form data-auth="login" novalidate>${fld('email','Email address','email',{ac:'email',ph:'you@school.edu'})}${fld('password','Password','password',{ac:'current-password',ph:'Your password'})}
<div class="auth-row"><label class="chk"><input type="checkbox" name="remember" id="remember"> Remember me</label></div>
<button class="btn sun auth-btn" type="submit"><span class="sp" aria-hidden="true"></span><span class="lbl">Continue</span></button></form>
<p class="auth-alt">New here? <a href="#register">Create an account</a></p>`)}
function register(){return authShell('Join AnswerSheet AI','Create your account and check a whole class in minutes.',
`<h1>Create Account</h1><p class="sub">It only takes a minute.</p><div id="aerr"></div>
<form data-auth="register" novalidate>${fld('full_name','Full name','text',{ac:'name',ph:'Your name',max:120})}${fld('email','Email address','email',{ac:'email',ph:'you@school.edu'})}${fld('institution','Institution / school','text',{ac:'organization',ph:'Your school or college',max:150,opt:1,req:false})}
${fld('password','Password','password',{ac:'new-password',ph:'At least 8 characters'}).replace('<small class="msg"','<div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="meter-l" id="meter-l"></div><small class="msg"')}${fld('confirm','Confirm password','password',{ac:'new-password',ph:'Type it again'})}
<div class="auth-row" style="margin-bottom:8px"><label class="chk"><input type="checkbox" name="terms" id="terms" aria-describedby="terms-m"> <span>I agree to the <a href="#register">Terms</a> and <a href="#register">Privacy Policy</a></span></label></div><small class="msg" id="terms-m" role="alert" style="display:block;margin:0 0 14px;color:var(--badt);font-weight:700;font-size:13px"></small>
<button class="btn sun auth-btn" type="submit"><span class="sp" aria-hidden="true"></span><span class="lbl">Create Account</span></button></form>
<p class="auth-alt">Already have an account? <a href="#login">Sign in</a></p>`)}

// keep what was typed if the page re-renders (e.g. window resize does not, but a hash change might)
function authKeep(){const f=document.querySelector('form[data-auth]');if(!f)return null;const o={};f.querySelectorAll('input').forEach(i=>{o[i.id]=i.type=='checkbox'?i.checked:i.value});return {m:f.dataset.auth,o}}
function authRestore(k){if(!k||!document.querySelector(`form[data-auth="${k.m}"]`))return;for(const id in k.o){const i=document.getElementById(id);if(i&&i.type!='password'){if(i.type=='checkbox')i.checked=k.o[id];else i.value=k.o[id]}}}

const EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;
function fmsg(id,m){const i=document.getElementById(id),s=document.getElementById(id+'-m');if(s)s.textContent=m||'';if(i&&i.type!='checkbox'){if(m)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid')}return m}
function authBanner(m){const b=$('#aerr');if(b)b.innerHTML=m?`<div class="err" role="alert">${E(m)}</div>`:''}
function validate(mode,v){const bad=[];const chk=(id,m)=>{if(fmsg(id,m))bad.push(id)};
 if(mode=='register')chk('full_name',v.full_name.trim().length<2?'Please enter your full name.':'');
 chk('email',!v.email.trim()?'Email is required.':!EMAIL_RE.test(v.email.trim())?'Enter a valid email address.':'');
 if(mode=='login')chk('password',!v.password?'Password is required.':'');
 else{chk('password',v.password.length<8?'Use at least 8 characters.':'');chk('confirm',!v.confirm?'Please confirm your password.':v.confirm!==v.password?'Passwords do not match.':'');if(!v.terms){bad.push('terms');$('#terms-m').textContent='Please accept the Terms and Privacy Policy.'}else $('#terms-m').textContent=''}
 return bad}
function strength(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p)&&/[^A-Za-z0-9]/.test(p))s++;if(/\d/.test(p)||/[^A-Za-z0-9]/.test(p))s=Math.max(s,p.length>=8?2:1);return p?Math.min(4,Math.max(1,s)):0}
async function handleAuth(f){const mode=f.dataset.auth,g=id=>f.elements[id],v={full_name:g('full_name')?g('full_name').value:'',email:g('email').value,password:g('password').value,confirm:g('confirm')?g('confirm').value:'',institution:g('institution')?g('institution').value:'',terms:g('terms')?g('terms').checked:true,remember:g('remember')?g('remember').checked:false};
 authBanner('');const bad=validate(mode,v);if(bad.length){const el=document.getElementById(bad[0]);if(el)el.focus();return}
 const btn=f.querySelector('.auth-btn');btn.disabled=true;btn.classList.add('busy');
 try{const body=mode=='login'?{email:v.email,password:v.password,remember:v.remember}:{full_name:v.full_name,email:v.email,password:v.password,institution:v.institution};
  const r=await api('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  saveSession(r.token,r.user,mode=='login'?v.remember:false);S.tok=r.token;S.user=r.user;toast(mode=='login'?'Welcome back, '+r.user.full_name.split(' ')[0]+'!':'Account created. Welcome!');go('dashboard')}
 catch(e){authBanner(e.message);btn.disabled=false;btn.classList.remove('busy')}}
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-auth]');if(!f)return;e.preventDefault();handleAuth(f)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-eye]');if(!b)return;const i=document.getElementById(b.dataset.eye),show=i.type=='password';i.type=show?'text':'password';b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',show?'Hide password':'Show password')});
document.addEventListener('input',e=>{const t=e.target;if(t.closest&&t.closest('form[data-auth]')){if(t.type!='checkbox')fmsg(t.id,'');else if(t.id=='terms')$('#terms-m').textContent=''}
 if(t.id=='password'&&$('#meter')){const s=strength(t.value),c=['','#F2704F','#F7C535','#4FC3F0','#2FB67C'][s];document.querySelectorAll('#meter i').forEach((b,i)=>b.style.background=i<s?c:'');$('#meter-l').textContent=['','Weak','Fair','Good','Strong'][s]}});
async function downloadExcel(){try{const r=await fetch(API+`/api/exams/${S.exam}/export`,{headers:{Authorization:'Bearer '+S.tok}});if(r.status==401){expire();return}if(!r.ok)throw new Error('Download failed ('+r.status+')');const m=/filename="?([^";]+)"?/.exec(r.headers.get('Content-Disposition')||'');const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download=m?m[1]:'results.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast(e.message)}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
 if(a=='step')S.step=i;else if(a=='rm')S.files.splice(i,1);else if(a=='run'){run();return}
 else if(a=='open')S.sel=i;else if(a=='close'){S.sel=null;S.modal=null}else if(a=='man')S.modal=i;
 else if(a=='goto'){S.exam=i;location.hash='results';return}
 else if(a=='sort'){const k=t.dataset.k;S.dir=S.sort==k?-S.dir:1;S.sort=k}
 else if(a=='xl'){downloadExcel();return}
 else if(a=='logout'){logout();return}
 else if(a=='save'){const id=S.modal,v=+$('#mv').value;api(`/api/exams/submissions/${id}/manual`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({marks:v,name:$('#mn').value,roll_no:$('#mr').value})}).then(()=>{S.modal=null;toast('Marks saved');load()}).catch(x=>toast(x.message));return}
 render()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('tr[data-a],th[data-a]'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;$('#tb').innerHTML=rows()}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;const i=+t.dataset.i,v=t.value;
 if(c=='file'){handleFiles(t.dataset.k,t.files);t.value='';return}
 if(c=='exam'){S.exam=+v;S.res=null;load();return}
 if(c=='neg')S.neg=Math.min(0,+v||0);else if(c=='title')S.title=v;else if(c=='qt')S.Q[i].text=v;else if(c=='qy')S.Q[i].type=v;else if(c=='qm')S.Q[i].marks=Math.max(0,+v||0);else if(c=='key')S.Q[i].correct=v;
 render()});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-f]'))e.preventDefault()});
document.addEventListener('drop',e=>{const d=e.target.closest('[data-f]');if(d){e.preventDefault();handleFiles(d.dataset.f,e.dataTransfer.files)}});
addEventListener('hashchange',()=>{S.sel=null;S.modal=null;S.res=null;load()});
(async function boot(){if(S.tok){try{S.user=await api('/api/auth/me')}catch(e){}}render();load()})();
</script>
</body>
</html>
